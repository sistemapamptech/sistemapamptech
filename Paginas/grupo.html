<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Cadastro de Grupo</title>
  <link rel="stylesheet" href="../style.css">
  <script src="https://kit.fontawesome.com/4866ffbdb2.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- BARRA LATERAL (SIDEBAR) -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <!-- Logo Pamptech -->
      <div class="logo">
        <img src="../img/pamptech-logo-bglight.png">
      </div>
      <!-- Menu de Navegação -->
      <nav class="sidebar-menu">
        <a href="../index.html" class="menu-item active"><i class="fa-solid fa-house"></i>&emsp;Home</a>
        <!-- DROPDOWN: CADASTROS -->
        <div class="dropdown">
          <a href="#" class="menu-item dropdown-btn">
            <span>› Cadastros</span>
            <span class="arrow">▾</span>
          </a>
          <div class="dropdown-content">
            <a href="../Paginas/grupo.html" class="submenu-item"><i class="fa-solid fa-users"></i>&emsp;Grupo</a>
            <a href="../Paginas/subgrupo.html" class="submenu-item"><i class="fa-solid fa-users-line"></i>&emsp;Subgrupo</a>
            <a href="../Paginas/categoria.html" class="submenu-item"><i class="fa-regular fa-folder"></i>&emsp;Categoria</a>
            <a href="../Paginas/subcategoria.html" class="submenu-item"><i class="fa-regular fa-folder-open"></i>&emsp;Subcategoria</a>
          </div>
        </div>
        <a href="../Paginas/parametros.html" class="menu-item">› Parâmetros</a>
        <a href="../Paginas/fornecedor.html" class="menu-item">› Fornecedor</a>
        <a href="../Paginas/materiaprima.html" class="menu-item">› Grupo</a>
        <a href="../Paginas/produto.html" class="menu-item">› Produtos</a>
        <a href="../Paginas/usuario.html" class="menu-item">› Usuários</a>
        <a href="../Paginas/relatorio.html" class="menu-item">› Relatórios</a>
      </nav>
    </div>  
    <hr class="menu-divider">
    <!-- Rodapé do Sidebar -->
    <div class="sidebar-footer">
      <a href="#" id="btn-logout" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i>Sair</a>
    </div>
  </aside>
  
  <!-- CONTEÚDO PRINCIPAL (MAIN) -->
  <main class="main-content">
    
    <!-- DIV-USER: Bloco de perfil do usuário no topo -->
    <header class="div-user">
      <div class="user-profile">
        <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
        <div class="user-info">
          <span class="greeting">Bem Vindo!</span>
          <strong class="username"><span id="nome-usuario" style="font-weight: bold; margin-right: 15px;"></span></strong>
        </div>
      </div>
    </header>

    <!-- DIV-TITLE: Título da página e botões de ação -->
    <section class="div-title">
      <h1>Cadastro de Grupo</h1>
      
      <div class="action-buttons">
        <button id="btn-incluir" class="btn btn-green">Incluir</button>
        <button id="btn-salvar" class="btn btn-blue">Salvar</button>
        <button id="btn-editar" class="btn btn-yellow">Editar</button>
        <button id="btn-deletar" class="btn btn-red">Deletar</button>
        <button id="btn-duplicar" class="btn btn-gray">Duplicar</button>
      </div>
    </section>

    <!-- DIV-CAD: Formulário de cadastro de grupos -->
    <section class="div-cad">
      <!-- SEÇÃO 1: DADOS PRINCIPAIS -->
      <section class="card-section">
        <span class="card-tag">Dados Principais</span>
        <!-- Adicionado id="form-produto" aqui -->
        <form id="form-produto" class="form-grid">
          <div class="form-group col-4">
            <label>Código:</label>
            <input type="text" id="codigo" name="codigo" readonly placeholder="Gerado automaticamente" disabled>
          </div>
          <div class="form-group col-8">
            <label>Descrição:</label>
            <input type="text" id="descricao" name="descricao" disabled required>
          </div>
        </form>
      </section>

      <!-- SEÇÃO 2: GRUPOS CADASTRADOS -->
      <section class="list-section">
        <div class="list-header">
          <h2>Grupos Cadastrados</h2>
          <div class="search-box">
            <input type="text" id="busca" placeholder="Buscar por código ou descr...">
            <button id="btn-buscar" class="btn btn-blue">Buscar</button>
          </div>
        </div>

        <div class="table-responsive">
          <table id="tabela-grupos" class="data-table">
            <thead>
              <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td></td>
                <td></td>
                <td><button class="btn-link">Selecionar</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- RODAPÉ DA PÁGINA -->
      <footer class="page-footer">
        <p>Pamptech - Soluções e Desenvolvimento. Todos os direitos reservados.</p>
      </footer>
    </section>
  </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC78Gjc24X90s20lQUVviCLsy5MQSzyiDk",
      authDomain: "pamptech-sistema.firebaseapp.com",
      projectId: "pamptech-sistema",
      storageBucket: "pamptech-sistema.firebasestorage.app",
      messagingSenderId: "950216971192",
      appId: "1:950216971192:web:bfed0e70b64bc738b1354d",
      measurementId: "G-EQDYPL7SB5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let listaGrupos = [];
    let modoAcao = "";

    document.addEventListener("DOMContentLoaded", function () {
        const usuarioLogado = localStorage.getItem("usuarioLogado");
        if (!usuarioLogado) { window.location.href = "../login.html"; return; }

        const userObj = JSON.parse(usuarioLogado);
        const campoUsuario = document.getElementById("nome-usuario");
        if (campoUsuario && userObj.nome) campoUsuario.textContent = userObj.nome;

        const btnLogout = document.getElementById("btn-logout");
        if (btnLogout) {
            btnLogout.addEventListener("click", function (e) {
                e.preventDefault();
                localStorage.removeItem("usuarioLogado");
                window.location.href = "../login.html";
            });
        }

        bloquearFormulario();
        carregarGrupos();

        document.getElementById("btn-incluir").addEventListener("click", iniciarInclusao);
        document.getElementById("btn-salvar").addEventListener("click", salvarOuAlterar);
        document.getElementById("btn-editar").addEventListener("click", iniciarEdicao);
        document.getElementById("btn-deletar").addEventListener("click", deletarGrupo);
        document.getElementById("busca").addEventListener("input", filtrarGrupos);
        document.getElementById("btn-buscar").addEventListener("click", filtrarGrupos);
    });

    function bloquearFormulario() { document.getElementById("descricao").disabled = true; modoAcao = ""; }
    function desbloquearFormulario() { document.getElementById("descricao").disabled = false; document.getElementById("descricao").focus(); }

    function iniciarInclusao() {
        modoAcao = "incluir";
        const form = document.getElementById("form-produto");
        if (form) form.reset();
        desbloquearFormulario();
        gerarProximoCodigoSequencial();
    }

    function iniciarEdicao() {
        if (!document.getElementById("codigo").value) { alert("Selecione um grupo para editar."); return; }
        modoAcao = "editar";
        desbloquearFormulario();
    }

    async function salvarOuAlterar() {
        if (!modoAcao) { alert("Clique em 'Incluir' para cadastrar ou selecione um registro e clique em 'Editar'."); return; }
        const desc = document.getElementById("descricao").value.trim();
        if (!desc) { alert("Preencha a descrição antes de salvar."); return; }

        const cod = String(document.getElementById("codigo").value).trim();
        try {
            await setDoc(doc(db, "grupos", cod), { codigo: cod, descricao: desc });
            alert(modoAcao === "incluir" ? "Grupo cadastrado com sucesso!" : "Grupo alterado com sucesso!");
            limparTela();
            carregarGrupos();
        } catch (e) { console.error("Erro ao salvar no Firestore:", e); }
    }

    async function deletarGrupo() {
        const cod = String(document.getElementById("codigo").value).trim();
        if (!cod) { alert("Selecione um grupo para deletar."); return; }
        if (!confirm(`Deseja realmente excluir o grupo código ${cod}?`)) return;

        try {
            await deleteDoc(doc(db, "grupos", cod));
            alert("Grupo deletado com sucesso!");
            limparTela();
            carregarGrupos();
        } catch (e) { console.error("Erro ao deletar no Firestore:", e); }
    }

    async function carregarGrupos() {
        try {
            const querySnapshot = await getDocs(collection(db, "grupos"));
            listaGrupos = [];
            querySnapshot.forEach(docSnap => listaGrupos.push(docSnap.data()));
            listaGrupos.sort((a, b) => Number(a.codigo) - Number(b.codigo));
            renderizarTabela(listaGrupos);
        } catch (e) { console.error("Erro ao carregar do Firestore:", e); }
    }

    function renderizarTabela(dados) {
        const tbody = document.querySelector("#tabela-grupos tbody");
        tbody.innerHTML = "";
        if (!dados || dados.length === 0) { tbody.innerHTML = '<tr><td colspan="3">Nenhum grupo cadastrado.</td></tr>'; return; }

        dados.forEach(g => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${g.codigo || ''}</td><td>${g.descricao || ''}</td><td><button type="button" class="btn-link" data-codigo="${g.codigo}" data-descricao="${g.descricao}">Selecionar</button></td>`;
            tbody.appendChild(tr);
        });

        tbody.querySelectorAll(".btn-link").forEach(btn => {
            btn.addEventListener("click", function() {
                document.getElementById("codigo").value = this.getAttribute("data-codigo");
                document.getElementById("descricao").value = this.getAttribute("data-descricao");
                bloquearFormulario();
            });
        });
    }

    function gerarProximoCodigoSequencial() {
        if (!listaGrupos.length) { document.getElementById("codigo").value = 1; return; }
        const nums = listaGrupos.map(g => Number(g.codigo)).filter(n => !isNaN(n));
        document.getElementById("codigo").value = (nums.length ? Math.max(...nums) : 0) + 1;
    }

    function filtrarGrupos() {
        const termo = document.getElementById("busca").value.toLowerCase();
        renderizarTabela(listaGrupos.filter(g => String(g.codigo).toLowerCase().includes(termo) || String(g.descricao).toLowerCase().includes(termo)));
    }

    function limparTela() {
        const form = document.getElementById("form-produto");
        if (form) form.reset();
        document.getElementById("codigo").value = "";
        bloquearFormulario();
    }
</script>

</body>
</html>
