<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

</head>
<body>

  <!-- BARRA LATERAL (SIDEBAR) -->

    <div class="sidebar-top">
      <!-- Logo Pamptech -->
      <div class="logo">
		    <img src="img/pamptech-logo-bglight.png">
      </div>
      <!-- Menu de Navegação -->
      <nav class="sidebar-menu">
        <a href="index.html" class="menu-item active"><i class="fa-solid fa-house"></i>&emsp;Home</a>
        <!-- DROPDOWN: CADASTROS -->
        <div class="dropdown">
          <a href="#" class="menu-item dropdown-btn">
            <span>› Cadastros</span>
            <span class="arrow">▾</span>
          </a>
          <div class="dropdown-content">
            <a href="./Paginas/grupo.html" class="submenu-item"><i class="fa-solid fa-users"></i>&emsp;Grupo</a>
            <a href="./Paginas/subgrupo.html" class="submenu-item"><i class="fa-solid fa-users-line"></i>&emsp;Subgrupo</a>
            <a href="./Paginas/categoria.html" class="submenu-item"><i class="fa-regular fa-folder"></i>&emsp;Categoria</a>
            <a href="./Paginas/subcategoria.html" class="submenu-item"><i class="fa-regular fa-folder-open"></i>&emsp;Subcategoria</a>
          </div>
        </div>
        <a href="./Paginas/parametros.html" class="menu-item">› Parâmetros</a>
        <a href="./Paginas/fornecedor.html" class="menu-item">› Fornecedor</a>
        <a href="./Paginas/materiaprima.html" class="menu-item">› Matéria-Prima</a>
        <a href="./Paginas/produto.html" class="menu-item">› Produtos</a>
        <a href="./Paginas/usuario.html" class="menu-item">› Usuários</a>
        <a href="./Paginas/relatorio.html" class="menu-item">› Relatórios</a>
      </nav>
    </div>	
	  <hr class="menu-divider">
    <!-- Rodapé do Sidebar -->
    <div class="sidebar-footer">
      <a href="#" id="btn-logout" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i>Sair</a>
    </div>
  </aside>

  <!-- CONTEÚDO PRINCIPAL (MAIN) -->
  <main class="main-content">
    
    <!-- DIV-USER: Bloco de perfil do usuário no topo -->
    <header class="div-user">
      <div class="user-profile">
        <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
        <div class="user-info">
          <span class="greeting">Bem Vindo!</span>
          <strong class="username"><span id="nome-usuario" style="font-weight: bold; margin-right: 15px;"></span></strong>
        </div>
      </div>
    </header>

    <!-- DIV-TITLE: Título da página e botões de ação -->
    <section class="div-title">
      <h1>Painel de controle</h1>      
    </section>

    <!-- DIV-CAD: Formulário de cadastro de produtos -->
    <section class="div-cad">
      <div class="card">
        
      </div>
    </section>

  </main>
  
<script>
  document.addEventListener("DOMContentLoaded", function () {
      // 1. Verifica se existe uma sessão ativa
      const sessao = localStorage.getItem("usuarioLogado");
      
      if (!sessao) {
          // Redireciona para o login se não estiver autenticado
          window.location.href = "login.html";
          return;
      }

      // 2. Exibe o nome do usuário logado no topo do painel
      const elNomeUsuario = document.getElementById("nome-usuario");
      if (elNomeUsuario) {
          const usuarioObj = JSON.parse(sessao);
          elNomeUsuario.innerText = "Usuário: " + (usuarioObj.nome || usuarioObj.usuario);
      }

      // 3. Ação do botão Sair (Logout)
      const btnLogout = document.getElementById("btn-logout");
      if (btnLogout) {
          btnLogout.addEventListener("click", function (e) {
              e.preventDefault();
              localStorage.removeItem("usuarioLogado");
              window.location.href = "login.html";
          });
      }
  });  
</script>


</body>
</html>
